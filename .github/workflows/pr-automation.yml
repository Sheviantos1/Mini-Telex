name: PR Automation Suite

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  security-events: write

concurrency:
  group: pr-automation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commit-summary:
    runs-on: ubuntu-latest
    name: Commit Message Summary
    continue-on-error: true 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - name: Generate commit summary
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr_number = context.issue.number;
            
            console.log(`Processing PR #${pr_number}`);
            
            const { data: commits } = await github.rest.pulls.listCommits({
              owner,
              repo,
              pull_number: pr_number
            });
            
            console.log(`Found ${commits.length} commits`);
            
            let commitList = [];
            let invalidCommits = [];
            
            for (const commit of commits) {
              const msg = commit.commit.message.split('\n')[0];
              const sha = commit.sha.substring(0, 7);
              const author = commit.commit.author.name;
              
              commitList.push(`- \`${sha}\` ${msg} (${author})`);
              
              if (!msg.includes(':') || msg.length < 10) {
                invalidCommits.push(`- \`${sha}\` "${msg}"`);
              }
            }
            
            let comment = `## 📝 Commit Summary\n\n`;
            comment += `**Total Commits:** ${commits.length}\n\n`;
            comment += commitList.join('\n');
            comment += '\n\n';
            
            if (invalidCommits.length > 0) {
              comment += `### ⚠️ Commit Message Format\n\n`;
              comment += `${invalidCommits.length} commit(s) need improvement:\n\n`;
              comment += invalidCommits.join('\n');
              comment += '\n\n**Expected format:** \`type: description\`\n';
              comment += '**Examples:** \`feat: add login\`, \`fix: resolve bug\`\n';
            } else {
              comment += `### ✅ All commits follow proper format!\n`;
            }
            
            comment += '\n---\n*This comment updates automatically*';
            
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pr_number
            });
            
            const existingComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('## 📝 Commit Summary')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: comment
              });
              console.log('Updated existing comment');
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr_number,
                body: comment
              });
              console.log('Created new comment');
            }

  file-changes:
    runs-on: ubuntu-latest
    name: File Changes Diagram
    continue-on-error: true  # Won't block PR merge
    
    steps:
      - name: Generate file changes visualization
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr_number = context.issue.number;
            
            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: pr_number
            });
            
            console.log(`Found ${files.length} changed files`);
            
            const added = files.filter(f => f.status === 'added');
            const modified = files.filter(f => f.status === 'modified');
            const deleted = files.filter(f => f.status === 'removed');
            const renamed = files.filter(f => f.status === 'renamed');
            
            const totalAdd = files.reduce((s, f) => s + f.additions, 0);
            const totalDel = files.reduce((s, f) => s + f.deletions, 0);
            
            let diagram = 'sequenceDiagram\n';
            diagram += '    participant Dev as Developer\n';
            diagram += `    participant PR as Pull Request #${pr_number}\n`;
            diagram += '    participant Files as Changed Files\n';
            diagram += '    participant CI as CI/CD Pipeline\n';
            diagram += '    participant Review as Code Review\n';
            diagram += '    \n';
            diagram += `    Dev->>PR: Push ${files.length} file(s)\n`;
            diagram += `    Note over PR: +${totalAdd} -${totalDel} lines\n`;
            diagram += '    \n';
            diagram += '    PR->>Files: Analyze Changes\n';
            
            if (added.length > 0) {
              diagram += `    Files->>CI: ${added.length} new file(s)\n`;
              diagram += '    Note right of CI: Added files need review\n';
            }
            
            if (modified.length > 0) {
              diagram += `    Files->>CI: ${modified.length} modified file(s)\n`;
              diagram += '    Note right of CI: Check for breaking changes\n';
            }
            
            if (deleted.length > 0) {
              diagram += `    Files->>CI: ${deleted.length} deleted file(s)\n`;
              diagram += '    Note right of CI: Verify no dependencies\n';
            }
            
            diagram += '    \n';
            diagram += '    CI->>Review: Run Quality Checks\n';
            diagram += '    Note over Review: Tests, Linting, Security\n';
            diagram += '    Review->>Dev: Ready for Review';
            
            const formatFiles = (arr, emoji, title) => {
              if (arr.length === 0) return '';
              let section = `\n#### ${emoji} ${title} (${arr.length})\n\n`;
              arr.slice(0, 10).forEach(f => {
                section += `- \`${f.filename}\` (+${f.additions} -${f.deletions})\n`;
              });
              if (arr.length > 10) {
                section += `- ... and ${arr.length - 10} more\n`;
              }
              return section;
            };
            
            let filesList = '';
            filesList += formatFiles(added, '🆕', 'Added');
            filesList += formatFiles(modified, '✏️', 'Modified');
            filesList += formatFiles(deleted, '🗑️', 'Deleted');
            filesList += formatFiles(renamed, '📝', 'Renamed');
            
            const totalChanges = totalAdd + totalDel;
            let sizeLabel, sizeEmoji;
            if (totalChanges < 100) {
              sizeLabel = 'XS';
              sizeEmoji = '🟢';
            } else if (totalChanges < 300) {
              sizeLabel = 'Small';
              sizeEmoji = '🟢';
            } else if (totalChanges < 600) {
              sizeLabel = 'Medium';
              sizeEmoji = '🟡';
            } else if (totalChanges < 1000) {
              sizeLabel = 'Large';
              sizeEmoji = '🟠';
            } else {
              sizeLabel = 'Very Large';
              sizeEmoji = '🔴';
            }
            
            const comment = `## 📊 PR Change Sequence Diagram\n\n\`\`\`mermaid\n${diagram}\n\`\`\`\n\n### 📁 File Changes Summary\n\n| Metric | Value |\n|--------|-------|\n| **Files Changed** | ${files.length} |\n| **Lines Added** | +${totalAdd} |\n| **Lines Deleted** | -${totalDel} |\n| **Net Change** | ${totalAdd - totalDel > 0 ? '+' : ''}${totalAdd - totalDel} |\n| **PR Size** | ${sizeEmoji} ${sizeLabel} |\n\n${filesList}\n\n${totalChanges > 600 ? '⚠️ **Large PR detected!** Consider splitting into smaller PRs.\n' : ''}\n---\n*Diagram auto-updates on every push*`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pr_number
            });
            
            const existingComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('## 📊 PR Change Sequence Diagram')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr_number,
                body: comment
              });
            }

  code-analysis:
    runs-on: ubuntu-latest
    name: Code Analysis Report
    continue-on-error: true  # Won't block PR merge
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Analyze Go files
        id: analyze
        run: |
          # Count Go files
          GO_FILES=$(find . -name "*.go" -not -path "./vendor/*" | wc -l)
          echo "go_files=$GO_FILES" >> $GITHUB_OUTPUT
          
          # Count test files
          TEST_FILES=$(find . -name "*_test.go" -not -path "./vendor/*" | wc -l)
          echo "test_files=$TEST_FILES" >> $GITHUB_OUTPUT
          
          # Count total lines of code
          if [ "$GO_FILES" -gt 0 ]; then
            LOC=$(find . -name "*.go" -not -path "./vendor/*" -exec cat {} \; | wc -l)
            echo "lines_of_code=$LOC" >> $GITHUB_OUTPUT
          else
            echo "lines_of_code=0" >> $GITHUB_OUTPUT
          fi
          
          # Check for common files
          [ -f "go.mod" ] && echo "has_go_mod=true" >> $GITHUB_OUTPUT || echo "has_go_mod=false" >> $GITHUB_OUTPUT
          [ -f "README.md" ] && echo "has_readme=true" >> $GITHUB_OUTPUT || echo "has_readme=false" >> $GITHUB_OUTPUT
          [ -f ".gitignore" ] && echo "has_gitignore=true" >> $GITHUB_OUTPUT || echo "has_gitignore=false" >> $GITHUB_OUTPUT
          [ -f "Dockerfile" ] && echo "has_dockerfile=true" >> $GITHUB_OUTPUT || echo "has_dockerfile=false" >> $GITHUB_OUTPUT
          
      - name: Post analysis report
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr_number = context.issue.number;
            
            const goFiles = '${{ steps.analyze.outputs.go_files }}' || '0';
            const testFiles = '${{ steps.analyze.outputs.test_files }}' || '0';
            const loc = '${{ steps.analyze.outputs.lines_of_code }}' || '0';
            const hasGoMod = '${{ steps.analyze.outputs.has_go_mod }}' === 'true';
            const hasReadme = '${{ steps.analyze.outputs.has_readme }}' === 'true';
            const hasGitignore = '${{ steps.analyze.outputs.has_gitignore }}' === 'true';
            const hasDockerfile = '${{ steps.analyze.outputs.has_dockerfile }}' === 'true';
            
            const testCoverage = parseInt(testFiles) > 0 ? 
              `${Math.round((parseInt(testFiles) / parseInt(goFiles)) * 100)}%` : 'N/A';
            
            let comment = `## 📈 Code Analysis Report\n\n`;
            comment += `### 📊 Project Statistics\n\n`;
            comment += `| Metric | Value |\n`;
            comment += `|--------|-------|\n`;
            comment += `| **Go Files** | ${goFiles} |\n`;
            comment += `| **Test Files** | ${testFiles} |\n`;
            comment += `| **Lines of Code** | ${parseInt(loc).toLocaleString()} |\n`;
            comment += `| **Test/Code Ratio** | ${testCoverage} |\n\n`;
            
            comment += `### 📋 Project Health Checklist\n\n`;
            comment += `${hasGoMod ? '✅' : '❌'} go.mod present\n`;
            comment += `${hasReadme ? '✅' : '❌'} README.md present\n`;
            comment += `${hasGitignore ? '✅' : '❌'} .gitignore present\n`;
            comment += `${hasDockerfile ? '✅' : '❌'} Dockerfile present\n\n`;
            
            comment += `### 💡 Recommendations\n\n`;
            
            const recommendations = [];
            if (!hasGoMod) recommendations.push('- Add go.mod for dependency management');
            if (!hasReadme) recommendations.push('- Add README.md for project documentation');
            if (!hasGitignore) recommendations.push('- Add .gitignore to exclude build artifacts');
            if (parseInt(testFiles) === 0) recommendations.push('- Add unit tests to improve code quality');
            if (parseInt(testFiles) > 0 && (parseInt(testFiles) / parseInt(goFiles)) < 0.3) {
              recommendations.push('- Increase test coverage (current ratio is low)');
            }
            
            if (recommendations.length > 0) {
              comment += recommendations.join('\n') + '\n';
            } else {
              comment += '✅ Project structure looks good!\n';
            }
            
            comment += `\n---\n*Analysis based on current repository state*`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pr_number
            });
            
            const existingComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('## 📈 Code Analysis Report')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr_number,
                body: comment
              });
            }

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    continue-on-error: true  # Won't block PR merge
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          
      - name: Parse Trivy results
        id: parse
        continue-on-error: true
        run: |
          if [ -f trivy-results.sarif ]; then
            # Count vulnerabilities by severity
            CRITICAL=$(grep -o '"level":"error"' trivy-results.sarif 2>/dev/null | wc -l || echo "0")
            HIGH=$(grep -o '"level":"warning"' trivy-results.sarif 2>/dev/null | wc -l || echo "0")
            TOTAL=$((CRITICAL + HIGH))
            
            echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
            echo "high=$HIGH" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            
            if [ "$TOTAL" -eq "0" ]; then
              echo "status=✅ No Issues" >> $GITHUB_OUTPUT
            elif [ "$CRITICAL" -gt "0" ]; then
              echo "status=🔴 Critical Issues" >> $GITHUB_OUTPUT
            else
              echo "status=🟡 Issues Found" >> $GITHUB_OUTPUT
            fi
          else
            echo "critical=0" >> $GITHUB_OUTPUT
            echo "high=0" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
            echo "status=✅ Scan Complete" >> $GITHUB_OUTPUT
          fi
          
          # Always exit successfully
          exit 0
          
      - name: Post security report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr_number = context.issue.number;
            
            const status = '${{ steps.parse.outputs.status }}' || '✅ Scan Complete';
            const critical = '${{ steps.parse.outputs.critical }}' || '0';
            const high = '${{ steps.parse.outputs.high }}' || '0';
            const total = '${{ steps.parse.outputs.total }}' || '0';
            
            const emoji = status.includes('🔴') ? '🔴' : status.includes('🟡') ? '🟡' : '✅';
            
            let comment = `## 🔒 Security Scan\n\n`;
            comment += `### ${emoji} Status: ${status}\n\n`;
            
            if (parseInt(total) > 0) {
              comment += `| Severity | Count |\n`;
              comment += `|----------|-------|\n`;
              comment += `| **Critical** | ${critical} |\n`;
              comment += `| **High** | ${high} |\n`;
              comment += `| **Total** | ${total} |\n\n`;
              
              if (parseInt(critical) > 0) {
                comment += `⚠️ **Critical vulnerabilities detected!** Review before merging.\n\n`;
              } else {
                comment += `⚠️ Issues found but none are critical.\n\n`;
              }
              
              comment += `**Action Items:**\n`;
              comment += `1. Review security findings in Actions tab\n`;
              comment += `2. Update dependencies if needed\n`;
              comment += `3. Check for security advisories\n`;
            } else {
              comment += `✅ No known security vulnerabilities detected\n\n`;
              comment += `**Scanned:**\n`;
              comment += `- Dependencies\n`;
              comment += `- Configuration files\n`;
              comment += `- Code for security patterns\n`;
            }
            
            comment += `\n---\n*Powered by Trivy Security Scanner*`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pr_number
            });
            
            const existingComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('## 🔒 Security Scan')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr_number,
                body: comment
              });
            }