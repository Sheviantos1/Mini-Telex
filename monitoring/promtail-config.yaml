# monitoring/promtail-config.yaml
# Promtail configuration - Collects logs from Docker containers

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Collect logs from Docker containers
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    
    relabel_configs:
      # Only collect from containers with logging=promtail label
      - source_labels: ['__meta_docker_container_label_logging']
        action: keep
        regex: promtail
      
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container_name
      
      # Extract service label
      - source_labels: ['__meta_docker_container_label_service']
        target_label: service
    
    pipeline_stages:
      # Parse timestamp from logs
      - timestamp:
          source: time
          format: RFC3339Nano
      
      # Extract log level if present
      - regex:
          expression: '.*\[(?P<level>INFO|WARN|ERROR|DEBUG|FATAL)\].*'
      
      # Add level as label
      - labels:
          level: