# monitoring/grafana/provisioning/datasources/datasources.yaml
# This auto-configures Loki and Prometheus in Grafana

apiVersion: 1

datasources:
  # Loki - For viewing logs
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true

  # Prometheus - For viewing metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: true